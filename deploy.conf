# What app-deploy's build.sh, deploy.sh and setup.sh need to know about this site. Sourced here and
# on the droplet, so it holds values only.

DOMAIN=torrin.me
SSH_HOST="root@${PUBLIC_IP:-138.197.149.45}"   # the droplet torrin.me resolves to, PUBLIC_IP overrides it
ENTRY=main.ts
STATS_LOG=torrin.me.stats.log

# The resume PDF is written from frontend/data/resume.json and the blog into frontend/public, both
# before vite copies that directory. The soundfont is 32 MB and fetched once, kept out of git.
BEFORE_VITE=(
	"npm run resume:pdf"
	"npm run content"
	"[[ -f radio/assets/GeneralUser-GS.sf2 ]] || npm run soundfont"
)
AFTER_VITE=("npm run pages")

SHIP=(dist main.ts modules 'radio/*.ts' radio/package.json radio/assets radio/run.sh)

SETUP_HOOK=setup-hook.sh

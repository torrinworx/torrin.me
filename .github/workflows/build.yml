name: Build Pipeline

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Install dependencies
        run: npm i

      # build.sh regenerates the resume PDF from frontend/data/resume.json before vite
      # runs, so the build needs Python and reportlab available.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resume generator dependencies
        run: pip install reportlab

      - name: Execute build script
        run: npm run build
